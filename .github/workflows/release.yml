name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3-beta

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION | sed 's/v//' | sed 's/\.//g' | cut -c1-6)" >> $GITHUB_OUTPUT

          # Determine if pre-release
          if [[ "$VERSION" == *"-"* ]] || [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

          # Find the unsigned APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SIGNED_APK="app/build/outputs/apk/release/enter-comm-${{ steps.version.outputs.version }}.apk"

          # Sign the APK
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:$KEYSTORE_PASSWORD \
            --ks-key-alias $KEY_ALIAS \
            --key-pass pass:$KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK_PATH"

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV
          rm keystore.jks

      - name: Rename APK (unsigned)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          RENAMED_APK="app/build/outputs/apk/release/enter-comm-${{ steps.version.outputs.version }}-unsigned.apk"
          mv "$APK_PATH" "$RENAMED_APK"
          echo "SIGNED_APK=$RENAMED_APK" >> $GITHUB_ENV

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Changes since $PREVIOUS_TAG:" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            # Group commits by type (conventional commits style)
            echo "### Features" >> CHANGELOG.md
            git log --oneline $PREVIOUS_TAG..HEAD --grep="^feat" --format="- %s" >> CHANGELOG.md || true
            echo "" >> CHANGELOG.md

            echo "### Bug Fixes" >> CHANGELOG.md
            git log --oneline $PREVIOUS_TAG..HEAD --grep="^fix" --format="- %s" >> CHANGELOG.md || true
            echo "" >> CHANGELOG.md

            echo "### Other Changes" >> CHANGELOG.md
            git log --oneline $PREVIOUS_TAG..HEAD --format="- %s" | grep -v "^- feat" | grep -v "^- fix" | head -20 >> CHANGELOG.md || true
            echo "" >> CHANGELOG.md

            # Add commit count and contributors
            COMMIT_COUNT=$(git rev-list --count $PREVIOUS_TAG..HEAD)
            echo "---" >> CHANGELOG.md
            echo "**$COMMIT_COUNT commits** since $PREVIOUS_TAG" >> CHANGELOG.md
          else
            echo "Initial release" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --oneline -20 --format="- %s" >> CHANGELOG.md
          fi

          # Add build info
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "**Build Info:**" >> CHANGELOG.md
          echo "- Version: ${{ steps.version.outputs.version }}" >> CHANGELOG.md
          echo "- Build Date: $(date -u +"%Y-%m-%d %H:%M UTC")" >> CHANGELOG.md
          echo "- Commit: ${GITHUB_SHA:0:7}" >> CHANGELOG.md

          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Enter-Comm ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ env.SIGNED_APK }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** ${{ steps.version.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ env.SIGNED_APK }}" >> $GITHUB_STEP_SUMMARY
